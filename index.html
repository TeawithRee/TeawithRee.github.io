<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tea with Ree</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root {
      --cream:#111111;   /* dark background */
      --paper:#1a1a1a;   /* slightly lighter dark */
      --ink:#f5f5f5;     /* main text color */
      --soft:#cccccc;    /* softer text */
      --muted:#999999;   /* muted text */
      --accent:#d4af37;  /* gold accent */
      --line:rgba(255,255,255,.15); /* subtle divider */
      --blush:#e6b7c7;   /* blush highlight */
    }
    html{scroll-behavior:smooth;scroll-padding-top:76px}
    body{background:var(--cream);color:var(--ink);font-family:'Playfair Display',serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:1.6rem 2.8rem;background:rgba(17,17,17,.86);border-bottom:1px solid var(--line);transition:padding .4s}
    nav.solid{padding:1rem 2.8rem;background:rgba(17,17,17,.95)}
    .brand{position:absolute;left:50%;transform:translateX(-50%);font-family:'Playfair Display',serif;font-weight:800;font-size:1.7rem;letter-spacing:-.01em;color:var(--accent)}
    .navlinks{display:flex;gap:2.1rem}
    .navlinks a{font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;position:relative;padding-bottom:4px;opacity:.82;transition:opacity .3s}
    .navlinks a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--accent);transition:width .35s}
    .navlinks a:hover{opacity:1}.navlinks a:hover::after{width:100%}
    .cover {
      background: linear-gradient(rgba(17,17,17,0.6), rgba(17,17,17,0.6)),
                  url('blue-and-blaze.jpg') center/cover no-repeat;
      color: var(--ink);
      padding: 100px 20px;
      text-align: center;
    }
    .cover h1 {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
    }
    .date {
      color: var(--accent);
      font-size: 0.9em;
      display: block;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="brand">Tea with Ree</div>
  </nav>

  <!-- Hero Cover -->
  <section class="cover">
    <h1>Welcome to Tea with Ree</h1>
    <p>Warm reflections, soulful stories, and cinematic mood.</p>
  </section>

  <!-- Example Card -->
  <section>
    <article>
      <h2><a href="books-finding-your-voice.html">Finding Your Voice</a></h2>
      <span class="date">August 2026</span>
      <p>A journey into confidence and storytelling.</p>
    </article>
  </section>
</body>
</html>
